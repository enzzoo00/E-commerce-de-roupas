# Sobe só o MySQL para desenvolvimento local deste serviço.
# O schema.sql roda sozinho na primeira vez que o container é criado.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clientes_db
      MYSQL_USER: clientes_user
      MYSQL_PASSWORD: clientes_pass
    ports:
      - "3307:3306"   # se a porta 3306 já estiver ocupada, use "3307:3306" e DB_PORT=3307
    volumes:
      - clientes_mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  clientes_mysql:
